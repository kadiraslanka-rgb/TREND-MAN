name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -o "do-it (1).zip" -d project
          echo "PROJECT CONTENTS:"
          ls -la project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: project
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        working-directory: project
        run: |
          npm install --save-dev @capacitor/cli --legacy-peer-deps
          npm install @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Build web application
        working-directory: project
        run: npm run build

      - name: Prepare web directory
        working-directory: project
        run: |
          rm -rf www

          if [ -d "dist" ]; then
            cp -R dist www
          elif [ -d "build" ]; then
            cp -R build www
          else
            echo "ERROR: Web build klasoru bulunamadi."
            exit 1
          fi

          echo "WWW CONTENTS:"
          ls -la www
          test -f www/index.html

      - name: Recreate Android project
        working-directory: project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

          echo "ANDROID CONTENTS:"
          ls -la android

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew olusturulamadi."
            exit 1
          fi

      - name: Make Gradle executable
        working-directory: project
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: project/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK FILES:"
          find project/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TREND-MAN-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
