name: TRADINGLY Android investigation
on:
  workflow_dispatch:
  push:
    branches: [main, codex/tradingly-build-investigation]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract TRADINGLY baseline project
        run: unzip -q tradingly-project.zip -d project
      - name: Install pinned dependencies and prepare frozen 1.4.5 web app
        working-directory: project
        run: |
          npm ci
          npm run build
      - name: Configure Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > project/android/local.properties
          chmod +x project/android/gradlew
      - name: Test and build diagnostic APK
        working-directory: project/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload diagnostic APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRADINGLY-diagnostic-debug
          path: |
            project/android/app/build/outputs/apk/debug/*.apk
            project/android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
