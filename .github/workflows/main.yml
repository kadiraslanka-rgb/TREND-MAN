name: TRADINGLY Android investigation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: unzip -q tradingly-project.zip -d project

      - name: Fix notification channel constant
        run: |
          sed -i 's/getImportance()==0/getImportance()==NotificationManager.IMPORTANCE_NONE/g' project/android/app/src/main/java/com/trendscanner/bybit/NotificationBridgePlugin.java

      - name: Prepare application
        working-directory: project
        run: |
          npm ci
          npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > project/android/local.properties
          chmod +x project/android/gradlew

      - name: Test and build APK
        working-directory: project/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRADINGLY-diagnostic-debug
          path: |
            project/android/app/build/outputs/apk/debug/*.apk
            project/android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
