name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -o "do-it (1).zip" -d project
          ls -la project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: project
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/android --legacy-peer-deps
          npm install -D @capacitor/cli --legacy-peer-deps

      - name: Build web app
        working-directory: project
        run: npm run build

      - name: Prepare Capacitor
        working-directory: project
        run: |
          rm -rf www android

          if [ -d "dist" ]; then
            cp -R dist www
          elif [ -d "build" ]; then
            cp -R build www
          else
            echo "WEB BUILD OUTPUT NOT FOUND"
            find . -maxdepth 2 -type f -name "index.html" -print
            exit 1
          fi

          test -f www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.trendman.scanner",
            "appName": "TREND-MAN",
            "webDir": "www"
          }
          EOF

          echo "CAPACITOR CONFIG:"
          cat capacitor.config.json

      - name: Create Android app
        working-directory: project
        run: |
          npx cap add android
          npx cap sync android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Build APK
        working-directory: project/android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "APK RESULTS:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TREND-MAN-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
