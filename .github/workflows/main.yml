name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o bybit-major-trend-scanner.zip -d project
          echo "PROJECT CONTENTS:"
          ls -la project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Build web application
        working-directory: project
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: project
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: project/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: project/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK FILES:"
          find project/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TREND-MAN-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
